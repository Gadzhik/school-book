<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Офлайн-первая приватная читалка для школьников: EPUB, FB2, PDF и другие форматы."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Читалка для школьников</title>
    <script>
      // До загрузки приложения: язык вкладки/заголовка из сохранённого выбора
      // (reader:locale), чтобы title не мигал русским при английском UI.
      try {
        if (localStorage.getItem('reader:locale') === 'en') {
          document.documentElement.lang = 'en';
          document.title = 'Reader for schoolkids';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
